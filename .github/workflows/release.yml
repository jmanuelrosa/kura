name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'
          if [[ ! "$TAG" =~ ^v${semver}$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build release assets
        run: |
          python build.py
          sha256sum dist/kura > first
          python build.py
          sha256sum dist/kura > second
          diff first second
          (cd dist && sha256sum kura > kura.sha256)

      - name: Smoke-test release asset
        run: |
          smoke_dir="$RUNNER_TEMP/kura-smoke"
          mkdir -p "$smoke_dir/home/.claude"
          cp dist/kura "$smoke_dir/kura"
          env -i PATH=/usr/bin:/bin HOME="$smoke_dir/home" \
            KURA_CATALOG="$GITHUB_WORKSPACE/tests/fixtures/catalog" \
            "$smoke_dir/kura" list --type plugin > /dev/null
          (cd dist && sha256sum --check kura.sha256)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            dist/kura \
            dist/kura.sha256 \
            --verify-tag \
            --title "kura $TAG" \
            --generate-notes
