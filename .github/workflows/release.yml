name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v (for example, 0.8.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Authorize release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch && "$REF" != "$DEFAULT_REF" ]]; then
            echo "Manual releases must run from $DEFAULT_REF." >&2
            exit 1
          fi
          for actor in "$ACTOR" "$TRIGGERING_ACTOR"; do
            permission=$(gh api "repos/$GH_REPO/collaborators/$actor/permission" --jq '.permission')
            if [[ "$permission" != admin ]]; then
              echo "$actor must be a repository admin to release." >&2
              exit 1
            fi
          done

      - name: Validate release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            TAG="v$VERSION"
          else
            TAG="$REF_NAME"
          fi
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'
          if [[ ! "$TAG" =~ ^v${semver}$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Third-party test packages run here, in a job that holds no write token, so a
  # compromised release of one cannot touch the tree the release job builds and hashes.
  test:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-test.txt

      - name: Run tests
        run: python -m pytest -q tests

  release:
    needs: [authorize, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.authorize.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Prepare release version
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exists=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" --jq "any(.[]; .ref == \"refs/tags/$TAG\")")
          if [[ "$exists" == true ]]; then
            echo "Tag $TAG already exists; refusing to reuse it." >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("kura/__version__.py")
          version = os.environ["TAG"][1:]
          source, count = re.subn(
              r'^__version__ = "[^"]*"$',
              f'__version__ = "{version}"',
              path.read_text(),
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Expected one __version__ assignment")
          path.write_text(source)
          PY

      - name: Match package version to release tag
        run: |
          expected="${TAG#v}"
          actual=$(python3 -c 'from kura.__version__ import __version__; print(__version__)')
          if [ "$actual" != "$expected" ]; then
            echo "kura/__version__.py is $actual but tag is $TAG" >&2
            exit 1
          fi

      - name: Build release assets
        run: |
          python build.py
          sha256sum dist/kura > first
          python build.py
          sha256sum dist/kura > second
          diff first second
          (cd dist && sha256sum kura > kura.sha256)

      - name: Smoke-test release asset
        run: |
          smoke_dir="$RUNNER_TEMP/kura-smoke"
          mkdir -p "$smoke_dir/home/.config/kura" "$smoke_dir/empty-home"
          ln -s "$GITHUB_WORKSPACE/tests/fixtures/catalog" "$smoke_dir/home/.config/kura/catalog"
          cp dist/kura "$smoke_dir/kura"
          env -i PATH=/usr/bin:/bin \
            "$smoke_dir/kura" --version > /dev/null
          env -i PATH=/usr/bin:/bin HOME="$smoke_dir/home" \
            "$smoke_dir/kura" list --type skill > /dev/null
          if env -i PATH=/usr/bin:/bin HOME="$smoke_dir/empty-home" \
            "$smoke_dir/kura" list --type skill > /dev/null 2> "$smoke_dir/refusal"; then
            echo "The asset must refuse when the catalog is missing." >&2
            exit 1
          fi
          grep -Fq "$smoke_dir/empty-home/.config/kura/catalog" "$smoke_dir/refusal"
          (cd dist && sha256sum --check kura.sha256)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kura

      - name: Create release commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- kura/__version__.py
          if ! git diff --cached --quiet; then
            bot='github-actions[bot]'
            bot_id=$(gh api "users/$bot" --jq '.id')
            host="${GITHUB_SERVER_URL#https://}"
            git -c user.name="$bot" -c user.email="$bot_id+$bot@users.noreply.$host" \
              commit -m "chore: release ${TAG#v}"
          fi
          git tag "$TAG"
          gh auth setup-git
          git push origin "refs/tags/$TAG"

      # Creating the tag from the GitHub Release UI publishes the release before
      # this job starts. Re-running a published tag must not replace its assets.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            ready=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | (index("kura") != null) and (index("kura.sha256") != null)')
            if [ "$ready" = true ]; then
              echo "Release $TAG already exists; leaving published assets unchanged."
              exit 0
            fi
            echo "Release $TAG exists without this build's assets; uploading them."
            gh release upload "$TAG" dist/kura dist/kura.sha256
            exit 0
          fi
          gh release create "$TAG" \
            dist/kura \
            dist/kura.sha256 \
            --verify-tag \
            --title "kura $TAG" \
            --generate-notes
