name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'
          if [[ ! "$TAG" =~ ^v${semver}$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Match package version to release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          actual=$(python3 -c 'from kura.__version__ import __version__; print(__version__)')
          if [ "$actual" != "$expected" ]; then
            echo "kura/__version__.py is $actual but tag is $TAG" >&2
            exit 1
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build release assets
        run: |
          python build.py
          sha256sum dist/kura > first
          python build.py
          sha256sum dist/kura > second
          diff first second
          (cd dist && sha256sum kura > kura.sha256)

      - name: Smoke-test release asset
        run: |
          smoke_dir="$RUNNER_TEMP/kura-smoke"
          mkdir -p "$smoke_dir/home/.config/kura"
          ln -s "$GITHUB_WORKSPACE/tests/fixtures/catalog" "$smoke_dir/home/.config/kura/catalog"
          cp dist/kura "$smoke_dir/kura"
          env -i PATH=/usr/bin:/bin \
            "$smoke_dir/kura" --version > /dev/null
          env -i PATH=/usr/bin:/bin HOME="$smoke_dir/home" \
            "$smoke_dir/kura" list --type skill > /dev/null
          (cd dist && sha256sum --check kura.sha256)

      # Creating the tag from the GitHub Release UI publishes the release before
      # this job starts. Re-running a published tag must not replace its assets.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            ready=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | (index("kura") != null) and (index("kura.sha256") != null)')
            if [ "$ready" = true ]; then
              echo "Release $TAG already exists; leaving published assets unchanged."
              exit 0
            fi
            echo "Release $TAG exists without this build's assets; uploading them."
            gh release upload "$TAG" dist/kura dist/kura.sha256
            exit 0
          fi
          gh release create "$TAG" \
            dist/kura \
            dist/kura.sha256 \
            --verify-tag \
            --title "kura $TAG" \
            --generate-notes
