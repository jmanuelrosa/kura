name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      # PyYAML is a test dependency and the oracle for the frontmatter scanner's
      # contract. The package itself imports nothing outside the standard library,
      # which test_packaging asserts.
      - run: python -m pip install pytest pyyaml

      - run: python -m pytest -q tests

      # The checksum identifies the exact asset bytes; a build that is not reproducible
      # from its source makes that identity meaningless.
      - name: Build twice and compare
        run: |
          python3 build.py
          shasum -a 256 dist/kura > first
          python3 build.py
          shasum -a 256 dist/kura > second
          diff first second

      - name: Run the asset against the fixed catalog
        run: |
          mkdir -p /tmp/isolated/home/.config/kura
          ln -s "$GITHUB_WORKSPACE/tests/fixtures/catalog" /tmp/isolated/home/.config/kura/catalog
          cp dist/kura /tmp/isolated/kura
          cd /tmp/isolated
          env -i PATH=/usr/bin:/bin HOME=/tmp/isolated/home \
            ./kura list --type skill > /dev/null
